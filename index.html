<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mayor of the Fair 2026 — Virginia Voter Guide</title>
  <style>
    /* ── Brand palette ─────────────────────────────────────────────────────────
       Source: https://maketintsandshades.com/#colors=5b1453,009192,e96a26,46494b
       #5b1453  plum / deep purple
       #009192  teal
       #e96a26  orange
       #46494b  charcoal
    ──────────────────────────────────────────────────────────────────────────── */
    :root {
      --plum:     #5b1453;
      --plum-lt:  #8c4585;   /* ~40% tint */
      --plum-bg:  #f5eef4;   /* ~90% tint */
      --teal:     #009192;
      --teal-lt:  #66bfbf;
      --teal-bg:  #e5f5f5;
      --orange:   #e96a26;
      --orange-lt:#f4a876;
      --orange-bg:#fdf2ea;
      --charcoal: #46494b;
      --gray-lt:  #dfe0e1;
      --white:    #ffffff;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--plum-bg);
      min-height: 100vh;
      padding: 20px 16px 40px;
    }

    /* ── Widget shell ────────────────────────────────────────────────────────── */
    .widget {
      max-width: 760px;
      margin: 0 auto;
      background: var(--white);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 6px 32px rgba(91,20,83,.18);
    }

    /* ── Banner ─────────────────────────────────────────────────────────────── */
    .banner {
      background: var(--plum);
      padding: 28px 24px 22px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .banner::after {
      /* subtle star-field texture */
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.15) 1px, transparent 1px),
        radial-gradient(circle, rgba(255,255,255,.08) 1px, transparent 1px);
      background-size: 30px 30px, 17px 17px;
      background-position: 0 0, 15px 15px;
      pointer-events: none;
    }
    .banner-inner { position: relative; z-index: 1; }
    .eyebrow {
      display: inline-block;
      background: var(--orange);
      color: var(--white);
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 99px;
      margin-bottom: 10px;
    }
    .banner h1 {
      font-size: clamp(1.6rem, 5vw, 2.6rem);
      font-weight: 900;
      color: var(--white);
      line-height: 1.1;
      margin-bottom: 6px;
    }
    .banner h1 em {
      font-style: normal;
      color: var(--orange-lt);
    }
    .banner-sub {
      font-size: .88rem;
      color: rgba(255,255,255,.75);
      max-width: 480px;
      margin: 0 auto;
    }

    /* ── Location tabs ───────────────────────────────────────────────────────── */
    .tabs-section {
      background: var(--plum-bg);
      border-bottom: 2px solid var(--gray-lt);
      padding: 14px 20px 0;
    }
    .tabs-label {
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--plum-lt);
      margin-bottom: 10px;
    }
    .tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .tab-btn {
      border: 2px solid var(--gray-lt);
      background: var(--white);
      color: var(--charcoal);
      padding: 7px 16px;
      border-radius: 10px 10px 0 0;
      font-size: .82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .18s;
      position: relative;
      top: 2px;
      line-height: 1;
    }
    .tab-btn:hover {
      border-color: var(--teal);
      color: var(--teal);
      background: var(--teal-bg);
    }
    .tab-btn.active {
      background: var(--teal);
      border-color: var(--teal);
      color: var(--white);
    }
    .tab-btn .tab-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      margin-right: 5px;
      vertical-align: middle;
      background: currentColor;
      opacity: .6;
    }

    /* ── Results body ────────────────────────────────────────────────────────── */
    .results-body { padding: 22px 20px 20px; }

    .location-heading {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .location-heading h2 {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--plum);
    }
    .vote-count-badge {
      background: var(--orange-bg);
      color: var(--orange);
      font-size: .72rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 99px;
      border: 1px solid var(--orange-lt);
    }

    /* ── Candidate grid ──────────────────────────────────────────────────────── */
    .candidates {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .card {
      border: 2px solid var(--gray-lt);
      border-radius: 16px;
      padding: 16px 12px 14px;
      text-align: center;
      background: var(--white);
      transition: transform .2s, box-shadow .2s, border-color .2s;
      position: relative;
      cursor: default;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 22px rgba(91,20,83,.12);
      border-color: var(--plum-lt);
    }

    /* Winner card */
    .card.winner {
      border-color: var(--teal);
      background: var(--teal-bg);
    }
    .card.winner::before {
      content: "🏆 Winner";
      position: absolute;
      top: -13px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--teal);
      color: var(--white);
      font-size: .62rem;
      font-weight: 800;
      letter-spacing: .05em;
      text-transform: uppercase;
      padding: 3px 12px;
      border-radius: 99px;
      white-space: nowrap;
    }

    /* Candidate avatar */
    .card-avatar {
      width: 88px;
      height: 88px;
      object-fit: contain;
      margin: 0 auto 8px;
      display: block;
    }

    .card-name {
      font-size: .9rem;
      font-weight: 800;
      color: var(--charcoal);
      line-height: 1.2;
      margin-bottom: 2px;
    }
    .card-tagline {
      font-size: .68rem;
      color: var(--plum-lt);
      font-style: italic;
      margin-bottom: 10px;
      line-height: 1.3;
      min-height: 2.6em;
    }

    /* Vote bar */
    .bar-track {
      height: 8px;
      background: var(--gray-lt);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 5px;
    }
    .bar-fill {
      height: 100%;
      border-radius: 99px;
      background: var(--teal);
      transition: width .65s cubic-bezier(.4,0,.2,1);
    }
    .card.winner .bar-fill { background: var(--teal); }

    .card-stat {
      font-size: .78rem;
      font-weight: 700;
      color: var(--charcoal);
    }
    .card-pct {
      font-size: .68rem;
      color: #888;
      margin-left: 4px;
      font-weight: 400;
    }

    /* ── Summary strip ───────────────────────────────────────────────────────── */
    .summary-strip {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--plum-bg);
      border: 1.5px solid var(--gray-lt);
      border-radius: 12px;
      padding: 10px 16px;
      font-size: .8rem;
      color: var(--plum-lt);
      flex-wrap: wrap;
    }
    .summary-strip strong { color: var(--plum); }
    .summary-sep {
      width: 1px;
      height: 16px;
      background: var(--gray-lt);
      flex-shrink: 0;
    }

    /* ── Footer ─────────────────────────────────────────────────────────────── */
    .widget-footer {
      padding: 12px 20px;
      border-top: 1.5px solid var(--gray-lt);
      background: var(--plum-bg);
      font-size: .7rem;
      color: var(--plum-lt);
      text-align: center;
    }
    .widget-footer a {
      color: var(--teal);
      font-weight: 600;
      text-decoration: none;
    }
    .widget-footer a:hover { text-decoration: underline; }

    /* ── Responsive ─────────────────────────────────────────────────────────── */
    @media (max-width: 500px) {
      .candidates { grid-template-columns: repeat(2, 1fr); }
      .banner h1 { font-size: 1.5rem; }
      .tab-btn { padding: 6px 10px; font-size: .75rem; }
    }
  </style>
</head>
<body>

<div class="widget" id="motf-widget">

  <!-- Banner -->
  <div class="banner">
    <div class="banner-inner">
      <div class="eyebrow">Virginia Voter Guide 2026</div>
      <h1>Mayor of the <em>Fair</em> 🎪</h1>
      <p class="banner-sub">Kids at community tabling events picked their favorite candidate. See who's winning!</p>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs-section">
    <div class="tabs-label">📍 Choose a fair</div>
    <div class="tabs" id="tabs-container"></div>
  </div>

  <!-- Results -->
  <div class="results-body">
    <div class="location-heading">
      <h2 id="location-heading-text"></h2>
      <span class="vote-count-badge" id="vote-count-badge"></span>
    </div>
    <div class="candidates" id="candidates-container"></div>
    <div class="summary-strip" id="summary-strip"></div>
  </div>

  <!-- Footer -->
  <div class="widget-footer">
    Results collected at community tabling events &mdash; not a real election &bull;
    <a href="https://vva.lfg.guide" target="_blank">Virginia Voter Guide 2026</a>
  </div>

</div>

<script>
// ── Candidate roster ──────────────────────────────────────────────────────────
// taglines come from the voter guide PDFs
const CANDIDATES = {
  spring: [
    {
      id: "sunny",
      name: "Sunny the Sunshine",
      tagline: "I will make every day bright and fun",
      logo: "assets/candidates/sunny-the-sunshine.svg",
    },
    {
      id: "betty",
      name: "Betty the Butterfly",
      tagline: "I will throw magical dance parties",
      logo: "assets/candidates/betty-the-butterfly.png",
    },
    {
      id: "frank",
      name: "Frank the Flower",
      tagline: "I will turn every place into a colorful garden",
      logo: "assets/candidates/frank-the-flower.png",
    },
    {
      id: "linda",
      name: "Linda the Ladybug",
      tagline: "I will be your tiny superhero",
      logo: "assets/candidates/linda-the-ladybug.png",
    },
  ],
  hop: [
    {
      id: "buttons",
      name: "Buttons",
      tagline: "Buttons for Mayor!",
      logo: null,
      emoji: "🐶",
    },
    {
      id: "bunny",
      name: "Easter Bunny",
      tagline: "Hoppy days are coming",
      logo: null,
      emoji: "🐰",
    },
    {
      id: "lulu",
      name: "Lulu the Lamb",
      tagline: "Soft on the issues",
      logo: null,
      emoji: "🐑",
    },
    {
      id: "chirpy",
      name: "Chirpy the Chick",
      tagline: "A fresh start for the fair",
      logo: null,
      emoji: "🐥",
    },
  ],
};

// ── Locations ─────────────────────────────────────────────────────────────────
// votes: { candidateId: count }
// winnerId: the candidate who got the most real ticks on the ballot
const LOCATIONS = [
  {
    id: "all",
    label: "All Fairs",
    name: "All Fair Locations (Combined)",
    slate: "spring",
    votes: { sunny: 72, betty: 58, frank: 89, linda: 41 },
    winnerId: "frank",
  },
  {
    id: "gordonsville",
    label: "Gordonsville",
    name: "Mayor of Spring — Gordonsville",
    slate: "spring",
    votes: { sunny: 34, betty: 27, frank: 48, linda: 19 },
    winnerId: "frank",
  },
  {
    id: "spring",
    label: "Spring Fair",
    name: "Mayor of Spring",
    slate: "spring",
    votes: { sunny: 38, betty: 31, frank: 41, linda: 22 },
    winnerId: "frank",
  },
  {
    id: "hop",
    label: "The Hop",
    name: "Mayor of the Hop",
    slate: "hop",
    votes: { buttons: 45, bunny: 22, lulu: 17, chirpy: 31 },
    winnerId: "buttons",
  },
];

// ── State & helpers ───────────────────────────────────────────────────────────
let active = LOCATIONS[0];

function totalVotes(votes) {
  return Object.values(votes).reduce((a, b) => a + b, 0);
}

// ── Render tabs ───────────────────────────────────────────────────────────────
function renderTabs() {
  document.getElementById("tabs-container").innerHTML = LOCATIONS.map(loc => `
    <button
      class="tab-btn ${loc.id === active.id ? "active" : ""}"
      onclick="selectLocation('${loc.id}')"
    >${loc.label}</button>
  `).join("");
}

// ── Render results ────────────────────────────────────────────────────────────
function renderResults() {
  const loc = active;
  const votes = loc.votes;
  const total = totalVotes(votes);
  const maxVotes = Math.max(...Object.values(votes));
  const candidates = CANDIDATES[loc.slate];

  document.getElementById("location-heading-text").textContent = loc.name;
  document.getElementById("vote-count-badge").textContent =
    `${total} vote${total !== 1 ? "s" : ""} cast`;

  document.getElementById("candidates-container").innerHTML = candidates.map(c => {
    const v = votes[c.id] ?? 0;
    const pct = total > 0 ? Math.round((v / total) * 100) : 0;
    const barPct = total > 0 ? Math.round((v / maxVotes) * 100) : 0;
    const isWinner = c.id === loc.winnerId;

    const avatarHtml = c.logo
      ? `<img class="card-avatar" src="${c.logo}" alt="${c.name}" />`
      : `<div class="card-avatar" style="font-size:3.5rem;line-height:88px">${c.emoji}</div>`;

    return `
      <div class="card ${isWinner ? "winner" : ""}">
        ${avatarHtml}
        <div class="card-name">${c.name}</div>
        <div class="card-tagline">"${c.tagline}"</div>
        <div class="bar-track">
          <div class="bar-fill" style="width:${barPct}%"></div>
        </div>
        <div class="card-stat">${v} votes<span class="card-pct">${pct}%</span></div>
      </div>
    `;
  }).join("");

  const winner = candidates.find(c => c.id === loc.winnerId);
  const runnerUp = [...candidates]
    .sort((a, b) => (votes[b.id] ?? 0) - (votes[a.id] ?? 0))
    .find(c => c.id !== loc.winnerId);

  document.getElementById("summary-strip").innerHTML = `
    <span>🗳️ <strong>${total}</strong> total votes</span>
    <span class="summary-sep"></span>
    <span>🏆 Winner: <strong>${winner ? winner.name : "—"}</strong></span>
    ${runnerUp ? `<span class="summary-sep"></span><span>2nd: ${runnerUp.name}</span>` : ""}
  `;
}

// ── Select location ───────────────────────────────────────────────────────────
function selectLocation(id) {
  active = LOCATIONS.find(l => l.id === id);
  renderTabs();
  renderResults();
}

// ── Init ──────────────────────────────────────────────────────────────────────
renderTabs();
renderResults();
</script>
</body>
</html>
