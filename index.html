<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mayor of the Fair 2026 — Central Virginia Voter Guide</title>
  <!-- Brand typography (Charlottesville Tomorrow Brand Guide, May 2022):
       Display: ITC Franklin Gothic Pro, Demi Compressed (H1-H3),
                Medium Compressed (H4), Bold All-Caps (H5/H6)
       Body:    ATF Franklin Gothic Regular; Captions: Light
       Web fallbacks: Oswald (condensed display), Libre Franklin (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Libre+Franklin:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    /* ── Brand palette (Brand Guide §3.1) ─────────────────────────────────────
       Charcoal #46494B · Purple #5b1453 · Teal #019192 · Orange #E96A26
       Tints in 20% increments only (§3.3); shades in 20% increments (§3.4)
    ──────────────────────────────────────────────────────────────────────────── */
    :root {
      --purple:      #5b1453;
      --purple-60:   #9c7297;   /* 60% tint */
      --purple-20:   #ded0dd;   /* 20% tint */
      --purple-10:   #efe7ee;   /* 10% tint */
      --teal:        #019192;
      --teal-20:     #cce9e9;   /* 20% tint */
      --orange:      #e96a26;
      --orange-60:   #f2a57d;   /* 60% tint */
      --orange-20:   #fbe1d4;   /* 20% tint */
      --charcoal:    #46494b;
      --charcoal-20: #dadbdb;   /* 20% tint */
      --white:       #ffffff;

      /* Typography (Brand Guide §4) */
      --font-display: 'ITC Franklin Gothic Pro', 'Franklin Gothic Demi Cond',
                      'Oswald', 'Arial Narrow', sans-serif;
      --font-body:    'ATF Franklin Gothic', 'Franklin Gothic Book',
                      'Libre Franklin', 'Franklin Gothic Medium', Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      font-size: 16px;            /* minimum font size: 16px */
      background: var(--purple-10);
      min-height: 100vh;
      padding: 20px 16px 40px;
      color: var(--charcoal);
    }

    /* ── Widget shell ────────────────────────────────────────────────────────── */
    .widget {
      max-width: 800px;
      margin: 0 auto;
      background: var(--white);
      overflow: hidden;
      box-shadow: 0 6px 32px rgba(91,20,83,.18);
    }

    /* ── Banner ─────────────────────────────────────────────────────────────── */
    .banner {
      background: var(--purple);
      padding: 32px 24px 26px;
      text-align: center;
    }
    .eyebrow {
      display: inline-block;
      background: var(--orange);
      color: var(--white);
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 4px 14px;
      margin-bottom: 12px;
    }
    .banner h1 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 700;
      text-transform: uppercase;
      color: var(--white);
      line-height: 1.05;
      margin-bottom: 8px;
      letter-spacing: .01em;
    }
    .banner h1 em {
      font-style: normal;
      color: var(--orange-60);
    }
    .banner-sub {
      font-size: 16px;
      color: var(--purple-20);
      max-width: 520px;
      margin: 0 auto;
    }

    /* ── Location tabs ───────────────────────────────────────────────────────── */
    .tabs-section {
      background: var(--purple-10);
      border-bottom: 2px solid var(--charcoal-20);
      padding: 16px 20px 0;
    }
    .tabs-label {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--purple);
      margin-bottom: 10px;
    }
    .tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .tab-btn {
      border: 2px solid var(--charcoal-20);
      border-bottom: none;
      background: var(--white);
      color: var(--charcoal);
      padding: 9px 18px;
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: .03em;
      cursor: pointer;
      transition: all .18s;
      line-height: 1;
    }
    .tab-btn:hover {
      border-color: var(--teal);
      color: var(--teal);
      background: var(--teal-20);
    }
    .tab-btn.active {
      background: var(--teal);
      border-color: var(--teal);
      color: var(--white);
    }

    /* ── Results body ────────────────────────────────────────────────────────── */
    .results-body { padding: 24px 20px 20px; }

    .location-heading {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }
    .location-heading h2 {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--purple);
      letter-spacing: .01em;
    }
    /* ── Candidate grid ──────────────────────────────────────────────────────── */
    .candidates {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 18px;
      margin-bottom: 0;
    }

    .card {
      border: 2px solid var(--charcoal-20);
      padding: 22px 12px 16px;
      text-align: center;
      background: var(--white);
      transition: transform .2s, box-shadow .2s, border-color .2s;
      position: relative;
      opacity: .9;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 22px rgba(91,20,83,.12);
      border-color: var(--purple-60);
    }

    .card.winner {
      border: 3px solid var(--teal);
      background: var(--teal-20);
      opacity: 1;
    }
    .card.winner::before {
      content: "🏆 Winner";
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--teal);
      color: var(--white);
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: .05em;
      text-transform: uppercase;
      padding: 2px 14px;
      white-space: nowrap;
    }
    .card.winner[data-tie="true"]::before {
      content: "🏆 Co-Winner";
    }

    .card-avatar {
      width: 100px;
      height: 100px;
      object-fit: contain;
      margin: 0 auto 10px;
      display: block;
    }

    .card-name {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--charcoal);
      line-height: 1.15;
      margin-bottom: 4px;
      letter-spacing: .01em;
    }
    .card-tagline {
      font-size: 16px;
      font-weight: 300;
      color: var(--purple-60);
      font-style: italic;
      line-height: 1.3;
      min-height: 3.9em;
    }

    /* ── Footer ─────────────────────────────────────────────────────────────── */
    .widget-footer {
      padding: 14px 20px;
      border-top: 1.5px solid var(--charcoal-20);
      background: var(--purple-10);
      font-size: 16px;
      font-weight: 300;
      color: var(--charcoal);
      text-align: center;
    }
    .widget-footer a {
      color: var(--teal);
      font-weight: 600;
      text-decoration: none;
    }
    .widget-footer a:hover { text-decoration: underline; }

    /* ── Responsive ─────────────────────────────────────────────────────────── */
    @media (max-width: 540px) {
      .candidates { grid-template-columns: repeat(2, 1fr); }
      .tab-btn { padding: 8px 12px; }
    }
  </style>
</head>
<body>

<div class="widget" id="motf-widget">

  <!-- Banner -->
  <div class="banner">
    <div class="eyebrow">Virginia Voter Guide 2026</div>
    <h1>Mayor of the <em>Fair</em> <span style="font-size:1.4em;vertical-align:baseline;line-height:1">🎪</span></h1>
    <p class="banner-sub">Kids at community tabling events picked their favorite candidate!</p>
  </div>

  <!-- Tabs -->
  <div class="tabs-section">
    <div class="tabs-label">📍 Choose a fair</div>
    <div class="tabs" id="tabs-container"></div>
  </div>

  <!-- Results -->
  <div class="results-body">
    <div class="location-heading">
      <h2 id="location-heading-text"></h2>
    </div>
    <div class="candidates" id="candidates-container"></div>
  </div>

  <!-- Footer -->
  <div class="widget-footer">
    Results collected at community tabling events &mdash; not a real election &bull;
    <a href="https://www.cvilletomorrow.org/2026-central-virginia-voter-guide/" target="_blank">Central Virginia Voter Guide 2026</a>
  </div>

</div>

<script>
// ── Candidate rosters (taglines from voter guide PDFs) ────────────────────────
const CANDIDATES = {
  spring: [
    { id: "sunny", name: "Sunny the Sunshine", tagline: "I will make every day bright and fun",              logo: "assets/candidates/sunny-the-sunshine.svg" },
    { id: "betty", name: "Betty the Butterfly", tagline: "I will throw magical dance parties",               logo: "assets/candidates/betty-the-butterfly.png" },
    { id: "frank", name: "Frank the Flower",    tagline: "I will turn every place into a colorful garden",  logo: "assets/candidates/frank-the-flower.png" },
    { id: "linda", name: "Linda the Ladybug",   tagline: "I will be your tiny superhero",                   logo: "assets/candidates/linda-the-ladybug.png" },
  ],
  hop: [
    { id: "buttons", name: "Buttons",           tagline: "Cookies for everyone!",             logo: null, emoji: "🐶" },
    { id: "bunny",   name: "Easter Bunny",       tagline: "Bigger Easter Egg Hunt!",          logo: null, emoji: "🐰" },
    { id: "lulu",    name: "Lulu the Lamb",      tagline: "Bedtime stories anytime!",             logo: null, emoji: "🐑" },
    { id: "chirpy",  name: "Chirpy the Chick",   tagline: "Chocolate egss for everyone!",     logo: null, emoji: "🐥" },
  ],
  river: [
    { id: "don",    name: "Don the Duck",        tagline: "I will protect my friends by watching from above, getting rid of bugs!", logo: null, emoji: "🦆" },
    { id: "dana",   name: "Dana the Dragonfly",  tagline: "I will keep the river fun by spreading seeds for plants to grow!",       logo: "assets/candidates/dana-the-dragonfly.png" },
    { id: "tom",    name: "Tom the Turtle",      tagline: "I will make the river clean and get rid of all the dead plants.",        logo: "assets/candidates/tom-the-turtle.png" },
    { id: "felicia",name: "Felicia the Fish",    tagline: "I will provide food for animals and people!",                            logo: "assets/candidates/felicia-the-fish.png" },
  ],
  farm: [
    { id: "betsy",     name: "Betsy the Cow",        tagline: "Free Ice Cream Fridays!",       logo: null, emoji: "🐄" },
    { id: "henrietta", name: "Henrietta the Chicken", tagline: "Egg Hunts every weekend!",     logo: null, emoji: "🐔" },
    { id: "gary",      name: "Gary the Goat",         tagline: "Water balloon Saturdays!",     logo: null, emoji: "🐐" },
    { id: "pete",      name: "Pete the Pig",           tagline: "Free Cupcakes Tuesdays!",     logo: null, emoji: "🐷" },
  ],
};

// ── Locations (winnerIds = ballot tally winners, supports ties) ───────────────
const LOCATIONS = [
  { id: "gordonsville", label: "Gordonsville in Bloom",              name: "Mayor of Spring — Gordonsville", slate: "spring", winnerIds: ["linda"]           },
  { id: "hop",          label: "Easter Bash, Charlottesville",       name: "Mayor of the Hop",              slate: "hop",    winnerIds: ["buttons"]         },
  { id: "river",        label: "Rivanna River Fest, Charlottesville",name: "Mayor of the River",            slate: "river",  winnerIds: ["tom"]             },
  { id: "farm",         label: "Farm Festival, Louisa",              name: "Mayor of the Farm",             slate: "farm",   winnerIds: ["pete"]            },
  { id: "spring",       label: "Spring Festival, Lovingston",        name: "Mayor of Spring — Lovingston",  slate: "spring", winnerIds: ["betty", "frank"]  },
];

// ── State ─────────────────────────────────────────────────────────────────────
let active = LOCATIONS[0];

// ── Render tabs ───────────────────────────────────────────────────────────────
function renderTabs() {
  document.getElementById("tabs-container").innerHTML = LOCATIONS.map(loc => `
    <button
      class="tab-btn ${loc.id === active.id ? "active" : ""}"
      onclick="selectLocation('${loc.id}')"
    >${loc.label}</button>
  `).join("");
}

// ── Render results ────────────────────────────────────────────────────────────
function renderResults() {
  const loc = active;
  const candidates = CANDIDATES[loc.slate];

  document.getElementById("location-heading-text").textContent = loc.name;

  document.getElementById("candidates-container").innerHTML = candidates.map(c => {
    const isWinner = loc.winnerIds.includes(c.id);
    const isTie = loc.winnerIds.length > 1;
    const avatarHtml = c.logo
      ? `<img class="card-avatar" src="${c.logo}" alt="${c.name}" />`
      : `<div class="card-avatar" style="font-size:3.8rem;line-height:100px">${c.emoji}</div>`;

    return `
      <div class="card ${isWinner ? "winner" : ""}" ${isWinner && isTie ? 'data-tie="true"' : ""}>
        ${avatarHtml}
        <div class="card-name">${c.name}</div>
        <div class="card-tagline">"${c.tagline}"</div>
      </div>
    `;
  }).join("");
}

// ── Select location ───────────────────────────────────────────────────────────
function selectLocation(id) {
  active = LOCATIONS.find(l => l.id === id);
  renderTabs();
  renderResults();
}

// ── Init ──────────────────────────────────────────────────────────────────────
renderTabs();
renderResults();
</script>
</body>
</html>
