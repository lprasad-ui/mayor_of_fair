<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mayor of the Fair 2026 — Virginia Voter Guide</title>
  <!-- Brand typography (Charlottesville Tomorrow Brand Guide, May 2022):
       Display: ITC Franklin Gothic Pro, Demi Compressed (H1-H3),
                Medium Compressed (H4), Bold All-Caps (H5/H6)
       Body:    ATF Franklin Gothic Regular; Captions: Light
       Web fallbacks: Oswald (condensed display), Libre Franklin (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Libre+Franklin:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    /* ── Brand palette (Brand Guide §3.1) ─────────────────────────────────────
       Charcoal #46494B · Purple #5b1453 · Teal #019192 · Orange #E96A26
       Tints in 20% increments only (§3.3); shades in 20% increments (§3.4)
    ──────────────────────────────────────────────────────────────────────────── */
    :root {
      --purple:      #5b1453;
      --purple-60:   #9c7297;   /* 60% tint */
      --purple-20:   #ded0dd;   /* 20% tint */
      --purple-10:   #efe7ee;   /* 10% tint */
      --teal:        #019192;
      --teal-20:     #cce9e9;   /* 20% tint */
      --orange:      #e96a26;
      --orange-60:   #f2a57d;   /* 60% tint */
      --orange-20:   #fbe1d4;   /* 20% tint */
      --charcoal:    #46494b;
      --charcoal-20: #dadbdb;   /* 20% tint */
      --white:       #ffffff;

      /* Typography (Brand Guide §4) */
      --font-display: 'ITC Franklin Gothic Pro', 'Franklin Gothic Demi Cond',
                      'Oswald', 'Arial Narrow', sans-serif;
      --font-body:    'ATF Franklin Gothic', 'Franklin Gothic Book',
                      'Libre Franklin', 'Franklin Gothic Medium', Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      font-size: 16px;            /* minimum font size: 16px */
      background: var(--purple-10);
      min-height: 100vh;
      padding: 20px 16px 40px;
      color: var(--charcoal);
    }

    /* ── Widget shell ────────────────────────────────────────────────────────── */
    .widget {
      max-width: 800px;
      margin: 0 auto;
      background: var(--white);
      overflow: hidden;
      box-shadow: 0 6px 32px rgba(91,20,83,.18);
    }

    /* ── Banner ─────────────────────────────────────────────────────────────── */
    .banner {
      background: var(--purple);
      padding: 32px 24px 26px;
      text-align: center;
    }
    .eyebrow {
      display: inline-block;
      background: var(--orange);
      color: var(--white);
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 4px 14px;
      margin-bottom: 12px;
    }
    .banner h1 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 700;
      text-transform: uppercase;
      color: var(--white);
      line-height: 1.05;
      margin-bottom: 8px;
      letter-spacing: .01em;
    }
    .banner h1 em {
      font-style: normal;
      color: var(--orange-60);
    }
    .banner-sub {
      font-size: 16px;
      color: var(--purple-20);
      max-width: 520px;
      margin: 0 auto;
    }

    /* ── Location tabs ───────────────────────────────────────────────────────── */
    .tabs-section {
      background: var(--purple-10);
      border-bottom: 2px solid var(--charcoal-20);
      padding: 16px 20px 0;
    }
    .tabs-label {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--purple);
      margin-bottom: 10px;
    }
    .tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .tab-btn {
      border: 2px solid var(--charcoal-20);
      border-bottom: none;
      background: var(--white);
      color: var(--charcoal);
      padding: 9px 18px;
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: .03em;
      cursor: pointer;
      transition: all .18s;
      line-height: 1;
    }
    .tab-btn:hover {
      border-color: var(--teal);
      color: var(--teal);
      background: var(--teal-20);
    }
    .tab-btn.active {
      background: var(--teal);
      border-color: var(--teal);
      color: var(--white);
    }

    /* ── Results body ────────────────────────────────────────────────────────── */
    .results-body { padding: 24px 20px 20px; }

    .location-heading {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }
    .location-heading h2 {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--purple);
      letter-spacing: .01em;
    }
    .vote-count-badge {
      background: var(--orange-20);
      color: var(--orange);
      font-size: 16px;
      font-weight: 700;
      padding: 3px 12px;
      border: 1px solid var(--orange-60);
    }

    /* ── Candidate grid ──────────────────────────────────────────────────────── */
    .candidates {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .card {
      border: 2px solid var(--charcoal-20);
      padding: 18px 12px 14px;
      text-align: center;
      background: var(--white);
      transition: transform .2s, box-shadow .2s, border-color .2s;
      position: relative;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 22px rgba(91,20,83,.12);
      border-color: var(--purple-60);
    }

    .card.winner {
      border-color: var(--teal);
      background: var(--teal-20);
    }
    .card.winner::before {
      content: "🏆 Winner";
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--teal);
      color: var(--white);
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: .05em;
      text-transform: uppercase;
      padding: 2px 14px;
      white-space: nowrap;
    }

    .card-avatar {
      width: 92px;
      height: 92px;
      object-fit: contain;
      margin: 0 auto 10px;
      display: block;
    }

    .card-name {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--charcoal);
      line-height: 1.15;
      margin-bottom: 4px;
      letter-spacing: .01em;
    }
    .card-tagline {
      font-size: 16px;
      font-weight: 300;       /* caption weight: Light (Brand Guide §4.3) */
      color: var(--purple-60);
      font-style: italic;
      margin-bottom: 12px;
      line-height: 1.3;
      min-height: 3.9em;
    }

    .bar-track {
      height: 10px;
      background: var(--charcoal-20);
      overflow: hidden;
      margin-bottom: 6px;
    }
    .bar-fill {
      height: 100%;
      background: var(--teal);
      transition: width .65s cubic-bezier(.4,0,.2,1);
    }

    .card-stat {
      font-size: 16px;
      font-weight: 700;
      color: var(--charcoal);
    }
    .card-pct {
      font-size: 16px;
      color: var(--purple-60);
      margin-left: 4px;
      font-weight: 400;
    }

    /* ── Summary strip ───────────────────────────────────────────────────────── */
    .summary-strip {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--purple-10);
      border: 1.5px solid var(--charcoal-20);
      padding: 12px 18px;
      font-size: 16px;
      color: var(--charcoal);
      flex-wrap: wrap;
    }
    .summary-strip strong { color: var(--purple); }
    .summary-sep {
      width: 1px;
      height: 18px;
      background: var(--charcoal-20);
      flex-shrink: 0;
    }

    /* ── Footer ─────────────────────────────────────────────────────────────── */
    .widget-footer {
      padding: 14px 20px;
      border-top: 1.5px solid var(--charcoal-20);
      background: var(--purple-10);
      font-size: 16px;
      font-weight: 300;
      color: var(--charcoal);
      text-align: center;
    }
    .widget-footer a {
      color: var(--teal);
      font-weight: 600;
      text-decoration: none;
    }
    .widget-footer a:hover { text-decoration: underline; }

    /* ── Responsive ─────────────────────────────────────────────────────────── */
    @media (max-width: 540px) {
      .candidates { grid-template-columns: repeat(2, 1fr); }
      .tab-btn { padding: 8px 12px; }
    }
  </style>
</head>
<body>

<div class="widget" id="motf-widget">

  <!-- Banner -->
  <div class="banner">
    <div class="eyebrow">Virginia Voter Guide 2026</div>
    <h1>Mayor of the <em>Fair</em> 🎪</h1>
    <p class="banner-sub">Kids at community tabling events picked their favorite candidate. See who's winning!</p>
  </div>

  <!-- Tabs -->
  <div class="tabs-section">
    <div class="tabs-label">📍 Choose a fair</div>
    <div class="tabs" id="tabs-container"></div>
  </div>

  <!-- Results -->
  <div class="results-body">
    <div class="location-heading">
      <h2 id="location-heading-text"></h2>
      <span class="vote-count-badge" id="vote-count-badge"></span>
    </div>
    <div class="candidates" id="candidates-container"></div>
    <div class="summary-strip" id="summary-strip"></div>
  </div>

  <!-- Footer -->
  <div class="widget-footer">
    Results collected at community tabling events &mdash; not a real election &bull;
    <a href="https://vva.lfg.guide" target="_blank">Virginia Voter Guide 2026</a>
  </div>

</div>

<script>
// ── Candidate roster ──────────────────────────────────────────────────────────
// taglines come from the voter guide PDFs
const CANDIDATES = {
  spring: [
    {
      id: "sunny",
      name: "Sunny the Sunshine",
      tagline: "I will make every day bright and fun",
      logo: "assets/candidates/sunny-the-sunshine.svg",
    },
    {
      id: "betty",
      name: "Betty the Butterfly",
      tagline: "I will throw magical dance parties",
      logo: "assets/candidates/betty-the-butterfly.png",
    },
    {
      id: "frank",
      name: "Frank the Flower",
      tagline: "I will turn every place into a colorful garden",
      logo: "assets/candidates/frank-the-flower.png",
    },
    {
      id: "linda",
      name: "Linda the Ladybug",
      tagline: "I will be your tiny superhero",
      logo: "assets/candidates/linda-the-ladybug.png",
    },
  ],
  hop: [
    {
      id: "buttons",
      name: "Buttons",
      tagline: "Buttons for Mayor!",
      logo: null,
      emoji: "🐶",
    },
    {
      id: "bunny",
      name: "Easter Bunny",
      tagline: "Hoppy days are coming",
      logo: null,
      emoji: "🐰",
    },
    {
      id: "lulu",
      name: "Lulu the Lamb",
      tagline: "Soft on the issues",
      logo: null,
      emoji: "🐑",
    },
    {
      id: "chirpy",
      name: "Chirpy the Chick",
      tagline: "A fresh start for the fair",
      logo: null,
      emoji: "🐥",
    },
  ],
};

// ── Locations ─────────────────────────────────────────────────────────────────
// votes: { candidateId: count }
// winnerId: the candidate who got the most real ticks on the ballot
const LOCATIONS = [
  {
    id: "all",
    label: "All Fairs",
    name: "All Fair Locations (Combined)",
    slate: "spring",
    votes: { sunny: 72, betty: 58, frank: 89, linda: 41 },
    winnerId: "frank",
  },
  {
    id: "gordonsville",
    label: "Gordonsville",
    name: "Mayor of Spring — Gordonsville",
    slate: "spring",
    votes: { sunny: 34, betty: 27, frank: 48, linda: 19 },
    winnerId: "frank",
  },
  {
    id: "spring",
    label: "Spring Fair",
    name: "Mayor of Spring",
    slate: "spring",
    votes: { sunny: 38, betty: 31, frank: 41, linda: 22 },
    winnerId: "frank",
  },
  {
    id: "hop",
    label: "The Hop",
    name: "Mayor of the Hop",
    slate: "hop",
    votes: { buttons: 45, bunny: 22, lulu: 17, chirpy: 31 },
    winnerId: "buttons",
  },
];

// ── State & helpers ───────────────────────────────────────────────────────────
let active = LOCATIONS[0];

function totalVotes(votes) {
  return Object.values(votes).reduce((a, b) => a + b, 0);
}

// ── Render tabs ───────────────────────────────────────────────────────────────
function renderTabs() {
  document.getElementById("tabs-container").innerHTML = LOCATIONS.map(loc => `
    <button
      class="tab-btn ${loc.id === active.id ? "active" : ""}"
      onclick="selectLocation('${loc.id}')"
    >${loc.label}</button>
  `).join("");
}

// ── Render results ────────────────────────────────────────────────────────────
function renderResults() {
  const loc = active;
  const votes = loc.votes;
  const total = totalVotes(votes);
  const maxVotes = Math.max(...Object.values(votes));
  const candidates = CANDIDATES[loc.slate];

  document.getElementById("location-heading-text").textContent = loc.name;
  document.getElementById("vote-count-badge").textContent =
    `${total} vote${total !== 1 ? "s" : ""} cast`;

  document.getElementById("candidates-container").innerHTML = candidates.map(c => {
    const v = votes[c.id] ?? 0;
    const pct = total > 0 ? Math.round((v / total) * 100) : 0;
    const barPct = total > 0 ? Math.round((v / maxVotes) * 100) : 0;
    const isWinner = c.id === loc.winnerId;

    const avatarHtml = c.logo
      ? `<img class="card-avatar" src="${c.logo}" alt="${c.name}" />`
      : `<div class="card-avatar" style="font-size:3.5rem;line-height:92px">${c.emoji}</div>`;

    return `
      <div class="card ${isWinner ? "winner" : ""}">
        ${avatarHtml}
        <div class="card-name">${c.name}</div>
        <div class="card-tagline">"${c.tagline}"</div>
        <div class="bar-track">
          <div class="bar-fill" style="width:${barPct}%"></div>
        </div>
        <div class="card-stat">${v} votes<span class="card-pct">${pct}%</span></div>
      </div>
    `;
  }).join("");

  const winner = candidates.find(c => c.id === loc.winnerId);
  const runnerUp = [...candidates]
    .sort((a, b) => (votes[b.id] ?? 0) - (votes[a.id] ?? 0))
    .find(c => c.id !== loc.winnerId);

  document.getElementById("summary-strip").innerHTML = `
    <span>🗳️ <strong>${total}</strong> total votes</span>
    <span class="summary-sep"></span>
    <span>🏆 Winner: <strong>${winner ? winner.name : "—"}</strong></span>
    ${runnerUp ? `<span class="summary-sep"></span><span>2nd: ${runnerUp.name}</span>` : ""}
  `;
}

// ── Select location ───────────────────────────────────────────────────────────
function selectLocation(id) {
  active = LOCATIONS.find(l => l.id === id);
  renderTabs();
  renderResults();
}

// ── Init ──────────────────────────────────────────────────────────────────────
renderTabs();
renderResults();
</script>
</body>
</html>
